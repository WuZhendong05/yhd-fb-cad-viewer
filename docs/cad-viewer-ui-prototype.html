<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD 特征查看器 · 界面原型</title>
<style>
/* ============ Design Tokens ============ */
:root {
  /* Surface */
  --bg-app:        oklch(0.19 0.012 260);
  --bg-viewport:   oklch(0.13 0.014 255);
  --bg-panel:      oklch(0.22 0.013 260);
  --bg-panel-2:    oklch(0.25 0.014 260);
  --bg-hover:      oklch(0.29 0.016 260);
  --bg-active:     oklch(0.33 0.02 260);
  --border:        oklch(0.32 0.014 260);
  --border-strong: oklch(0.4 0.016 260);

  /* Text */
  --text-1: oklch(0.92 0.008 250);
  --text-2: oklch(0.68 0.012 255);
  --text-3: oklch(0.5 0.012 255);

  /* Brand / feature colors */
  --accent:        oklch(0.78 0.16 52);   /* amber highlight  #ff8c42-ish */
  --accent-strong: oklch(0.85 0.17 55);
  --accent-soft:   oklch(0.78 0.16 52 / 0.16);
  --select:        oklch(0.65 0.17 255);  /* blue selection   */
  --hole:   oklch(0.68 0.15 240);
  --groove: oklch(0.7 0.14 150);
  --boss:   oklch(0.66 0.14 300);
  --dfm:    oklch(0.7 0.19 35);

  /* Model colors */
  --model-base:  oklch(0.45 0.03 250);
  --model-dark:  oklch(0.35 0.03 250);
  --model-edge:  oklch(0.6 0.05 250);

  --font-ui: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px;
  --radius: 6px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg-app);
  color: var(--text-1);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  color: inherit;
  cursor: pointer;
}
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* ============ Top bar ============ */
.topbar {
  height: 46px;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: 0 var(--space-3);
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand {
  display: flex; align-items: center; gap: 9px;
  padding-right: var(--space-3);
  border-right: 1px solid var(--border);
}
.brand-mark {
  width: 20px; height: 20px; border-radius: 5px;
  background: linear-gradient(135deg, var(--accent), oklch(0.62 0.16 45));
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: oklch(0.2 0.02 40);
}
.part-name { font-weight: 600; font-size: 13px; letter-spacing: 0.01em; }
.part-src {
  font-size: 10.5px; color: var(--text-3);
  padding: 2px 7px; border: 1px solid var(--border-strong); border-radius: 20px;
}
.searchbox {
  flex: 1; max-width: 340px;
  display: flex; align-items: center; gap: 7px;
  background: var(--bg-viewport);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  color: var(--text-3);
}
.searchbox svg { width: 13px; height: 13px; flex-shrink: 0; }
.searchbox input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text-1); font-size: 12.5px; font-family: inherit;
}
.searchbox input::placeholder { color: var(--text-3); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: var(--radius);
  font-size: 12px; color: var(--text-2);
  border: 1px solid transparent;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent-strong); border-color: oklch(0.78 0.16 52 / 0.35); }
.icon-btn svg { width: 14px; height: 14px; }
.icon-btn.primary {
  background: var(--accent); color: oklch(0.2 0.02 40); font-weight: 600;
}
.icon-btn.primary:hover { background: var(--accent-strong); }

/* ============ Main layout ============ */
.main { flex: 1; display: flex; min-height: 0; }

/* ============ Feature tree ============ */
.tree-panel {
  width: 288px; flex-shrink: 0;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 260ms var(--ease-out);
  overflow: hidden;
}
.tree-panel.collapsed { width: 0; border-right: none; }
.tree-header {
  height: 38px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-3);
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  color: var(--text-3); text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tree-header .count { color: var(--text-2); font-family: var(--font-num); font-weight: 400; }
.tree-body { flex: 1; overflow-y: auto; padding: var(--space-2) 0 var(--space-4); }
.tree-body::-webkit-scrollbar { width: 8px; }
.tree-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

.tree { list-style: none; user-select: none; }
.tree ul { list-style: none; }
.tree-row {
  display: flex; align-items: center; gap: 6px;
  width: 100%; padding: 4px 10px 4px 8px;
  font-size: 12.5px; color: var(--text-1);
  border-radius: 4px;
  transition: background 120ms var(--ease-out);
  position: relative;
}
.tree-row:hover { background: var(--bg-hover); }
.tree-row.selected { background: var(--accent-soft); }
.tree-row.selected::before {
  content: ""; position: absolute; left: 0; top: 3px; bottom: 3px;
  width: 2.5px; border-radius: 2px; background: var(--accent);
}
.twisty {
  width: 14px; height: 14px; display: grid; place-items: center;
  color: var(--text-3); font-size: 8px;
  transition: transform 180ms var(--ease-out); flex-shrink: 0;
}
.twisty.open { transform: rotate(90deg); }
.twisty.leaf { visibility: hidden; }
.dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.row-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub {
  font-family: var(--font-num); font-size: 10.5px;
  color: var(--text-3); flex-shrink: 0;
}
.badge {
  font-family: var(--font-num); font-size: 10px;
  color: var(--text-2); background: var(--bg-panel-2);
  padding: 1px 6px; border-radius: 9px; flex-shrink: 0;
}
.cat-row { font-weight: 600; color: var(--text-2); letter-spacing: 0.02em; }
.group-row { font-weight: 500; padding-left: 18px; color: var(--text-2); }
.feature-row { padding-left: 34px; }
.feature-row .row-sub em { font-style: normal; color: var(--text-2); }
.tree-section-title {
  padding: 10px var(--space-3) 4px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em;
  color: var(--text-3); text-transform: uppercase;
}
.sep { height: 1px; background: var(--border); margin: var(--space-2) var(--space-3); }

/* ============ Viewport ============ */
.viewport {
  flex: 1; position: relative; min-width: 0;
  background:
    radial-gradient(1200px 500px at 50% 0%, oklch(0.16 0.015 255), transparent 70%),
    var(--bg-viewport);
}
.viewport-grid {
  position: absolute; inset: 0; opacity: 0.55; pointer-events: none;
  background-image:
    linear-gradient(oklch(0.25 0.01 255) 1px, transparent 1px),
    linear-gradient(90deg, oklch(0.25 0.01 255) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 30%, transparent 100%);
}
.vp-toolbar {
  position: absolute; top: 12px; left: 12px;
  display: flex; flex-direction: column; gap: 4px;
  padding: 5px;
  background: oklch(0.2 0.012 260 / 0.82);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(6px);
  z-index: 5;
}
.vp-toolbar-row { display: flex; gap: 4px; }
.vp-btn {
  width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: 4px; color: var(--text-2); font-size: 12px;
  font-family: var(--font-num);
  transition: background 120ms var(--ease-out), color 120ms var(--ease-out);
}
.vp-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.vp-btn.active { background: var(--accent-soft); color: var(--accent-strong); }
.vp-sep { width: 100%; height: 1px; background: var(--border); margin: 3px 0; }
.vp-hint {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text-3);
  background: oklch(0.2 0.012 260 / 0.7);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 4px 14px; pointer-events: none; z-index: 4;
  white-space: nowrap;
}
.vp-tag {
  position: absolute; top: 12px; right: 12px;
  font-family: var(--font-num); font-size: 10.5px; color: var(--text-3);
  background: oklch(0.2 0.012 260 / 0.7);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 4px 9px; z-index: 4;
}

/* Model SVG */
.model-wrap {
  position: absolute; inset: 0;
  display: grid; place-items: center;
}
.model-wrap svg { width: min(78%, 560px); height: auto; filter: drop-shadow(0 24px 40px oklch(0 0 0 / 0.5)); }
.face-group { transition: opacity 180ms var(--ease-out), filter 180ms var(--ease-out); cursor: pointer; }
.face-group .fill { transition: fill 180ms var(--ease-out), stroke 180ms var(--ease-out); }
.face-group:hover .fill { fill: oklch(0.78 0.16 52 / 0.35); }
.face-group.hl .fill { fill: var(--accent); stroke: var(--accent-strong); stroke-width: 1.5; }
.face-group.sel .fill { fill: oklch(0.65 0.17 255 / 0.8); stroke: oklch(0.75 0.18 255); stroke-width: 1.5; }
.face-label {
  font-family: var(--font-num); font-size: 9px; fill: var(--text-2);
  opacity: 0; transition: opacity 160ms var(--ease-out);
  pointer-events: none;
}
.face-group.hl .face-label, .face-group.sel .face-label { opacity: 1; }

/* ============ Inspector panel ============ */
.inspector {
  width: 0; flex-shrink: 0;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  overflow: hidden;
  transition: width 260ms var(--ease-out);
}
.inspector.open { width: 300px; }
.inspector-inner { width: 300px; height: 100%; display: flex; flex-direction: column; }
.insp-header {
  height: 38px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-3);
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  color: var(--text-3); text-transform: uppercase;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.insp-body { flex: 1; overflow-y: auto; padding: var(--space-4); }
.insp-empty {
  display: grid; place-items: center; text-align: center; height: 100%;
  color: var(--text-3); font-size: 12px; line-height: 1.7;
}
.insp-empty svg { width: 42px; height: 42px; margin-bottom: 10px; opacity: 0.4; }
.feat-hero {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg-panel-2);
  margin-bottom: var(--space-4);
}
.feat-hero .dot { width: 11px; height: 11px; }
.feat-hero .name { font-weight: 600; font-size: 13.5px; }
.feat-hero .dim { font-family: var(--font-num); font-size: 11px; color: var(--accent-strong); }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 12px; }
.kv dt { color: var(--text-3); }
.kv dd { color: var(--text-1); font-family: var(--font-num); font-size: 11.5px; }
.sect-title {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em;
  color: var(--text-3); text-transform: uppercase;
  margin: var(--space-4) 0 var(--space-2);
}
.face-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.face-chip {
  font-family: var(--font-num); font-size: 10.5px;
  padding: 3px 8px; border-radius: 4px;
  background: var(--bg-panel-2); border: 1px solid var(--border);
  color: var(--text-2);
}
.face-chip:hover { border-color: var(--accent); color: var(--accent-strong); }
.swatch-row { display: flex; align-items: center; gap: 8px; margin-top: var(--space-3); }
.swatch { width: 18px; height: 18px; border-radius: 4px; }
.swatch-opt { width: 18px; height: 18px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
.swatch-opt:hover { border-color: var(--text-2); }
.swatch-opt.on { border-color: var(--accent); }
.hl-toggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  margin-top: var(--space-4); font-size: 12px; color: var(--text-2);
  transition: background 140ms var(--ease-out);
}
.hl-toggle:hover { background: var(--bg-hover); }
.hl-toggle.on { border-color: oklch(0.78 0.16 52 / 0.4); color: var(--accent-strong); }
.hl-toggle .knob {
  width: 26px; height: 14px; border-radius: 8px; background: var(--border-strong);
  position: relative; transition: background 160ms var(--ease-out); margin-left: auto;
}
.hl-toggle .knob::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--text-2); transition: transform 160ms var(--ease-out), background 160ms;
}
.hl-toggle.on .knob { background: var(--accent); }
.hl-toggle.on .knob::after { transform: translateX(12px); background: oklch(0.2 0.02 40); }

/* ============ Status bar ============ */
.statusbar {
  height: 30px; flex-shrink: 0;
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-3);
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  font-family: var(--font-num); font-size: 11px; color: var(--text-2);
}
.status-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.status-item .k { color: var(--text-3); }
.status-bar-sep { width: 1px; height: 14px; background: var(--border); }
.status-hint { color: var(--text-3); font-family: var(--font-ui); }
.status-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); }
.loading-bar { width: 120px; height: 3px; border-radius: 2px; background: var(--bg-panel-2); overflow: hidden; }
.loading-bar i {
  display: block; height: 100%; width: 40%;
  background: var(--accent); border-radius: 2px;
  animation: load 2.2s var(--ease-out) infinite;
}
@keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }

/* Collapse button */
.collapse-btn {
  position: absolute; top: 12px; left: 12px; z-index: 6;
  width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: var(--radius); color: var(--text-2);
  background: oklch(0.2 0.012 260 / 0.82); border: 1px solid var(--border);
  transition: background 140ms var(--ease-out), color 140ms;
}
.collapse-btn:hover { background: var(--bg-hover); color: var(--text-1); }
.tree-panel.collapsed + .viewport .collapse-btn { left: 12px; }
.viewport { position: relative; }

/* Keyboard hint */
.kbd {
  display: inline-block; padding: 0 4px; border: 1px solid var(--border-strong);
  border-bottom-width: 2px; border-radius: 3px; font-family: var(--font-num);
  font-size: 10px; color: var(--text-2); line-height: 15px;
}
</style>
</head>
<body>

<!-- ============ Top bar ============ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">C</div>
    <div class="part-name">测试_1_ug<span class="part-src">UG/NX · STEP</span></div>
  </div>
  <div class="searchbox">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
    <input id="searchInput" type="text" placeholder="搜索特征 / 编号 / 面…">
  </div>
  <div class="top-actions">
    <button class="icon-btn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2h4l2.5 12H3.5L6 2zM4.5 9h7"/></svg>测量</button>
    <button class="icon-btn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12M8 2l-2 2m2-2l2 2M8 14l-2-2m2 2l2-2"/></svg>剖切</button>
    <button class="icon-btn active"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.4"/><path d="M8 2.6v10.8M2.6 8h10.8"/></svg>高亮</button>
  </div>
</header>

<div class="main">

  <!-- ============ Feature tree ============ -->
  <aside class="tree-panel" id="treePanel">
    <div class="tree-header"><span>特征 · 零件结构</span><span class="count">19</span></div>
    <div class="tree-body" id="treeBody"></div>
  </aside>

  <!-- ============ Viewport ============ -->
  <section class="viewport" id="viewport">
    <div class="viewport-grid"></div>
    <button class="collapse-btn" id="treeToggle" title="折叠/展开特征树 ( [ )">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" width="14" height="14">
        <path d="M6 3.5L10.5 8L6 12.5" id="toggleIcon"/>
      </svg>
    </button>

    <div class="vp-toolbar">
      <div class="vp-toolbar-row">
        <button class="vp-btn active" title="等轴测 (Home)">⧉</button>
        <button class="vp-btn" title="前视图 (F)">▭</button>
        <button class="vp-btn" title="顶视图 (T)">▭</button>
        <button class="vp-btn" title="右视图 (R)">▭</button>
      </div>
      <div class="vp-sep"></div>
      <div class="vp-toolbar-row">
        <button class="vp-btn" title="实体显示">●</button>
        <button class="vp-btn" title="线框显示">◌</button>
        <button class="vp-btn" title="半透明显示">◐</button>
      </div>
      <div class="vp-sep"></div>
      <div class="vp-toolbar-row">
        <button class="vp-btn" title="重置视角">↺</button>
        <button class="vp-btn" title="适配视图">⤢</button>
      </div>
    </div>

    <div class="vp-tag"><span id="vpFaceCount">174</span> 面 · <span id="vpEdgeCount">522</span> 边</div>

    <div class="model-wrap">
      <!-- Isometric plate mock -->
      <svg id="modelSvg" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="oklch(0.52 0.03 250)"/>
            <stop offset="1" stop-color="oklch(0.44 0.03 250)"/>
          </linearGradient>
          <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="oklch(0.34 0.03 250)"/>
            <stop offset="1" stop-color="oklch(0.30 0.03 250)"/>
          </linearGradient>
        </defs>

        <!-- Front face (side) -->
        <g class="face-group" data-face="side-front" style="cursor:default">
          <polygon class="fill" points="120,210 400,210 400,310 120,310" fill="url(#sideGrad)" stroke="var(--model-edge)" stroke-width="1"/>
        </g>

        <!-- Top face -->
        <g class="face-group" data-face="top">
          <polygon class="fill" points="120,210 260,140 400,210 260,280" fill="url(#topGrad)" stroke="var(--model-edge)" stroke-width="1"/>
        </g>

        <!-- Holes on top (ellipses for isometric circles) -->
        <g class="face-group" data-face="hole-top-a">
          <ellipse class="fill" cx="170" cy="196" rx="10" ry="6" fill="var(--bg-viewport)" stroke="var(--model-edge)" stroke-width="1.2"/>
        </g>
        <g class="face-group" data-face="hole-top-b">
          <ellipse class="fill" cx="232" cy="166" rx="10" ry="6" fill="var(--bg-viewport)" stroke="var(--model-edge)" stroke-width="1.2"/>
        </g>
        <g class="face-group" data-face="hole-top-c">
          <ellipse class="fill" cx="318" cy="196" rx="12" ry="7" fill="var(--bg-viewport)" stroke="var(--model-edge)" stroke-width="1.2"/>
        </g>

        <!-- Rectangular groove on top -->
        <g class="face-group" data-face="groove-top">
          <polygon class="fill" points="292,236 356,204 372,214 308,246" fill="oklch(0.19 0.015 255 / 0.9)" stroke="var(--model-edge)" stroke-width="1.2"/>
        </g>

        <!-- Boss (convex pad) on top -->
        <g class="face-group" data-face="boss-top">
          <polygon class="fill" points="146,240 176,225 190,233 160,248" fill="url(#topGrad)" stroke="var(--model-edge)" stroke-width="1.2"/>
          <polygon class="fill" points="146,240 160,248 160,262 146,254" fill="url(#sideGrad)" stroke="var(--model-edge)" stroke-width="1" opacity="0.85"/>
          <polygon class="fill" points="160,248 190,233 190,247 160,262" fill="url(#sideGrad)" stroke="var(--model-edge)" stroke-width="1" opacity="0.7"/>
        </g>

        <!-- Through hole on front -->
        <g class="face-group" data-face="hole-front">
          <ellipse class="fill" cx="260" cy="256" rx="8" ry="10" fill="var(--bg-viewport)" stroke="var(--model-edge)" stroke-width="1.2"/>
        </g>

        <!-- Face labels -->
        <text class="face-label" x="170" y="188">f12</text>
        <text class="face-label" x="232" y="158">f23</text>
        <text class="face-label" x="318" y="188">f31</text>
        <text class="face-label" x="330" y="232">f41</text>
        <text class="face-label" x="168" y="242">f5</text>
        <text class="face-label" x="252" y="242">f9</text>
      </svg>
    </div>

    <div class="vp-hint">中键旋转 · Shift+中键平移 · 滚轮缩放 · 单击选择面 <span class="kbd">Esc</span> 取消</div>
  </section>

  <!-- ============ Inspector ============ -->
  <aside class="inspector" id="inspector">
    <div class="inspector-inner">
      <div class="insp-header">
        <span>属性</span>
        <button class="icon-btn" id="inspClose" title="收起面板" style="padding:4px 6px">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" width="12" height="12"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="insp-body" id="inspBody"></div>
    </div>
  </aside>
</div>

<!-- ============ Status bar ============ -->
<footer class="statusbar">
  <span class="status-item"><span class="k">X</span> 32.07</span>
  <span class="status-item"><span class="k">Y</span> −18.42</span>
  <span class="status-item"><span class="k">Z</span> 5.00</span>
  <span class="status-bar-sep"></span>
  <span class="status-item">单位 <span style="color:var(--text-1)">mm</span></span>
  <span class="status-item" id="statusSel" style="color:var(--text-3)">未选择</span>
  <span class="status-right">
    <span class="loading-bar"><i></i></span>
    <span class="status-item">网格已就绪</span>
  </span>
</footer>

<script>
/* ============ Data model ============ */
const CATEGORIES = [
  {
    key: "hole", label: "孔", dot: "var(--hole)",
    groups: [
      { key: "through", label: "通孔 / 盲孔", count: 5,
        items: [
          { id: "through-1", name: "通孔1-1", dim: "⌀4 × 6", faces: ["hole-top-a"] },
          { id: "through-2", name: "通孔1-2", dim: "⌀4 × 6", faces: ["hole-top-b"] },
          { id: "through-3", name: "通孔2-1", dim: "⌀4 × 6", faces: ["hole-top-c"] },
          { id: "through-4", name: "通孔3-1", dim: "⌀6 × 8", faces: ["hole-front"] },
          { id: "through-5", name: "通孔3-2", dim: "⌀6 × 8", faces: ["hole-front"] }
        ] },
      { key: "counter", label: "沉头孔", count: 2,
        items: [
          { id: "counter-1", name: "沉孔1-1", dim: "⌀10.1 / ⌀3.4", faces: ["hole-top-a", "hole-top-b"] },
          { id: "counter-2", name: "沉孔1-2", dim: "⌀10.1 / ⌀3.4", faces: ["hole-top-c"] }
        ] }
    ]
  },
  {
    key: "groove", label: "槽", dot: "var(--groove)",
    groups: [
      { key: "rg", label: "规则槽", count: 1,
        items: [
          { id: "rg-1", name: "规则槽1-1", dim: "24 × 4 × 4.5", faces: ["groove-top"] }
        ] },
      { key: "irg", label: "不规则槽", count: 1,
        items: [
          { id: "irg-1", name: "不规则槽1-1", dim: "8 面", faces: ["groove-top", "top"] }
        ] }
    ]
  },
  {
    key: "boss", label: "台阶", dot: "var(--boss)",
    groups: [
      { key: "convex", label: "凸台", count: 2,
        items: [
          { id: "boss-1", name: "凸台1-1", dim: "3 面", faces: ["boss-top"] },
          { id: "boss-2", name: "凸台2-1", dim: "1 面", faces: ["boss-top"] }
        ] }
    ]
  },
  {
    key: "dfm", label: "DFM", dot: "var(--dfm)",
    groups: [
      { key: "d5005", label: "5005", count: 6,
        items: [
          { id: "dfm-1", name: "5005-1", dim: "可制造性", faces: ["hole-top-a"] },
          { id: "dfm-2", name: "5005-2", dim: "可制造性", faces: ["hole-top-b"] },
          { id: "dfm-3", name: "5005-3", dim: "可制造性", faces: ["hole-top-c"] },
          { id: "dfm-4", name: "5005-4", dim: "可制造性", faces: ["hole-front"] },
          { id: "dfm-5", name: "5005-5", dim: "可制造性", faces: ["groove-top"] },
          { id: "dfm-6", name: "5005-6", dim: "可制造性", faces: ["boss-top"] }
        ] },
      { key: "d6005", label: "6005", count: 1,
        items: [
          { id: "dfm-7", name: "6005-1", dim: "可制造性", faces: ["top"] }
        ] }
    ]
  }
];

/* ============ Build tree ============ */
const treeBody = document.getElementById("treeBody");
const FEATURES = new Map();
const collapsed = new Set(["structure"]);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function featureRow(f, cat) {
  FEATURES.set(f.id, f);
  const li = document.createElement("li");
  li.innerHTML = `
    <button class="tree-row feature-row" data-feature="${esc(f.id)}">
      <span class="twisty leaf"></span>
      <span class="dot" style="background:${cat.dot}"></span>
      <span class="row-label">${esc(f.name)}</span>
      <span class="row-sub">${esc(f.dim)}</span>
    </button>`;
  li.querySelector("button").addEventListener("click", (e) => selectFeature(f.id, e));
  return li;
}

function groupNode(g, cat) {
  const ul = document.createElement("ul");
  ul.className = "group-items";
  g.items.forEach(f => ul.appendChild(featureRow(f, cat)));
  const li = document.createElement("li");
  li.innerHTML = `
    <button class="tree-row group-row" data-group="${esc(cat.key)}:${esc(g.key)}">
      <span class="twisty open"></span>
      <span class="row-label">${esc(g.label)}</span>
      <span class="badge">${g.count}</span>
    </button>`;
  const btn = li.querySelector("button");
  const twisty = btn.querySelector(".twisty");
  btn.addEventListener("click", () => {
    const open = ul.style.display !== "none";
    ul.style.display = open ? "none" : "";
    twisty.classList.toggle("open", !open);
  });
  li.appendChild(ul);
  return li;
}

function categoryNode(cat) {
  const ul = document.createElement("ul");
  ul.className = "cat-items";
  cat.groups.forEach(g => ul.appendChild(groupNode(g, cat)));
  const li = document.createElement("li");
  li.innerHTML = `
    <button class="tree-row cat-row" data-cat="${esc(cat.key)}">
      <span class="twisty open"></span>
      <span class="dot" style="background:${cat.dot}"></span>
      <span class="row-label">${esc(cat.label)}</span>
      <span class="badge">${cat.groups.reduce((s, g) => s + g.count, 0)}</span>
    </button>`;
  const btn = li.querySelector("button");
  const twisty = btn.querySelector(".twisty");
  btn.addEventListener("click", () => {
    const open = ul.style.display !== "none";
    ul.style.display = open ? "none" : "";
    twisty.classList.toggle("open", !open);
  });
  li.appendChild(ul);
  return li;
}

function renderTree(filter = "") {
  treeBody.innerHTML = "";
  const wrap = document.createElement("ul");
  wrap.className = "tree";
  const q = filter.trim().toLowerCase();
  const hasCat = c => c.groups.some(g => g.items.some(f => (f.name + f.dim + f.id).toLowerCase().includes(q)));
  let total = 0;
  CATEGORIES.forEach(cat => {
    if (q && !hasCat(cat)) return;
    total += cat.groups.reduce((s, g) => s + g.count, 0);
    wrap.appendChild(categoryNode(cat));
  });
  // B-Rep structure (secondary)
  const secTitle = document.createElement("div");
  secTitle.className = "tree-section-title";
  secTitle.textContent = "零件结构";
  wrap.appendChild(secTitle);
  const sep = document.createElement("div");
  sep.className = "sep";
  wrap.appendChild(sep);
  const struct = document.createElement("ul");
  struct.className = "cat-items" + (collapsed.has("structure") ? "" : "");
  struct.style.display = collapsed.has("structure") ? "none" : "";
  const rows = ["Solid", "Face ×174", "Edge ×522", "Vertex ×261"];
  rows.forEach((r, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button class="tree-row group-row" style="padding-left:18px"><span class="twisty leaf"></span><span class="row-label">${esc(r)}</span></button>`;
    struct.appendChild(li);
  });
  const stBtn = document.createElement("button");
  stBtn.className = "tree-row cat-row";
  stBtn.innerHTML = `<span class="twisty"></span><span class="row-label">B-Rep</span><span class="badge">4</span>`;
  stBtn.addEventListener("click", () => {
    const open = struct.style.display !== "none";
    struct.style.display = open ? "none" : "";
    stBtn.querySelector(".twisty").classList.toggle("open", !open);
    if (open) collapsed.add("structure"); else collapsed.delete("structure");
  });
  stBtn.querySelector(".twisty").classList.add("open");
  wrap.appendChild(stBtn);
  wrap.appendChild(struct);
  treeBody.appendChild(wrap);
  document.querySelector(".tree-header .count").textContent = total;
}

/* ============ Selection & highlight ============ */
let selectedFeatureId = "";
const FEAT_COLOR = { hole: "var(--accent)", groove: "var(--accent)", boss: "var(--accent)", dfm: "var(--dfm)" };

function clearHighlights() {
  document.querySelectorAll(".face-group.hl, .face-group.sel").forEach(el => el.classList.remove("hl", "sel"));
}
function selectFeature(id, event) {
  const f = FEATURES.get(id);
  if (!f) return;
  selectedFeatureId = id;
  clearHighlights();
  const isDfm = id.startsWith("dfm");
  f.faces.forEach(fid => {
    const g = document.querySelector(`[data-face="${fid}"]`);
    if (g) g.classList.add(isDfm ? "sel" : "hl");
  });
  document.querySelectorAll(".tree-row.selected").forEach(r => r.classList.remove("selected"));
  if (event) {
    event.currentTarget.classList.add("selected");
    event.currentTarget.scrollIntoView({ block: "nearest" });
  } else {
    const btn = document.querySelector(`[data-feature="${id}"]`);
    if (btn) { btn.classList.add("selected"); btn.scrollIntoView({ block: "nearest" }); }
  }
  openInspector(f);
  updateStatus(f);
}

/* ============ Inspector ============ */
const inspector = document.getElementById("inspector");
const inspBody = document.getElementById("inspBody");

function openInspector(f) {
  inspector.classList.add("open");
  const cat = CATEGORIES.find(c => c.groups.some(g => g.items.some(i => i.id === f.id)));
  const dot = cat ? cat.dot : "var(--accent)";
  const color = FEAT_COLOR[f.id.startsWith("dfm") ? "dfm" : "hole"];
  inspBody.innerHTML = `
    <div class="feat-hero">
      <span class="dot" style="background:${dot}"></span>
      <div>
        <div class="name">${esc(f.name)}</div>
        <div class="dim">${esc(f.dim)}</div>
      </div>
    </div>
    <div class="sect-title">几何</div>
    <dl class="kv">
      <dt>类型</dt><dd>${esc(f.id.startsWith("dfm") ? "可制造性标记" : "加工特征")}</dd>
      <dt>关联面</dt><dd>${f.faces.length} 个</dd>
      <dt>来源</dt><dd>UG/NX 导出</dd>
      <dt>尺寸</dt><dd>${esc(f.dim)}</dd>
    </dl>
    <div class="sect-title">关联面</div>
    <div class="face-chips">${f.faces.map(fid => `<span class="face-chip">${esc(fid)}</span>`).join("")}</div>
    <div class="sect-title">高亮</div>
    <button class="hl-toggle on" id="hlToggle">
      <span>高亮显示</span><span class="knob"></span>
    </button>
    <div class="swatch-row">
      <span style="color:var(--text-3);font-size:11px">颜色</span>
      <button class="swatch-opt on" data-c="var(--accent)" style="background:var(--accent)" title="琥珀"></button>
      <button class="swatch-opt" data-c="var(--select)" style="background:var(--select)" title="蓝"></button>
      <button class="swatch-opt" data-c="var(--boss)" style="background:var(--boss)" title="紫"></button>
      <button class="swatch-opt" data-c="var(--groove)" style="background:var(--groove)" title="绿"></button>
    </div>`;
  const toggle = document.getElementById("hlToggle");
  toggle.addEventListener("click", () => {
    toggle.classList.toggle("on");
    if (!toggle.classList.contains("on")) clearHighlights();
    else selectFeature(f.id, null);
  });
  inspBody.querySelectorAll(".swatch-opt").forEach(btn => {
    btn.addEventListener("click", () => {
      inspBody.querySelectorAll(".swatch-opt").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      const color = btn.dataset.c;
      document.querySelectorAll(".face-group.hl .fill").forEach(el => el.style.fill = color);
    });
  });
}
function closeInspector() {
  inspector.classList.remove("open");
  clearHighlights();
  document.querySelectorAll(".tree-row.selected").forEach(r => r.classList.remove("selected"));
  document.getElementById("statusSel").textContent = "未选择";
  document.getElementById("statusSel").style.color = "var(--text-3)";
}
document.getElementById("inspClose").addEventListener("click", closeInspector);

function updateStatus(f) {
  const el = document.getElementById("statusSel");
  el.textContent = `已选：${f.name} · ${f.faces.length} 面`;
  el.style.color = "var(--accent-strong)";
}

/* ============ Tree collapse ============ */
const treePanel = document.getElementById("treePanel");
document.getElementById("treeToggle").addEventListener("click", () => {
  treePanel.classList.toggle("collapsed");
  document.getElementById("toggleIcon").setAttribute("d",
    treePanel.classList.contains("collapsed") ? "M10 3.5L5.5 8L10 12.5" : "M6 3.5L10.5 8L6 12.5");
});

/* ============ Search ============ */
document.getElementById("searchInput").addEventListener("input", (e) => renderTree(e.target.value));

/* ============ Viewport face pick ============ */
document.querySelectorAll(".face-group").forEach(g => {
  g.addEventListener("click", (e) => {
    e.stopPropagation();
    const fid = g.dataset.face;
    const match = [...FEATURES.entries()].find(([, f]) => f.faces.includes(fid) && !f.id.startsWith("dfm"));
    if (match) selectFeature(match[0], null);
  });
});
// viewport click clears
document.getElementById("viewport").addEventListener("click", (e) => {
  if (e.target.closest(".face-group") || e.target.closest(".vp-toolbar") || e.target.closest(".collapse-btn")) return;
  closeInspector();
});

/* ============ Toolbar demo ============ */
document.querySelectorAll(".vp-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const row = btn.parentElement;
    if (row.classList.contains("vp-toolbar-row") && row.querySelectorAll(".vp-btn").length > 1) {
      row.querySelectorAll(".vp-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }
  });
});

/* ============ Init ============ */
renderTree();
// Pre-select one feature to show the experience
selectFeature("through-1", null);
</script>
</body>
</html>
